# Render Blueprint — 백엔드 API 서버(무료 플랜) 1개
#
# 이 서버는 DB 에 저장된 리포트를 웹 화면(Netlify)에 전달하는 역할만 한다.
# 리포트 생성(하루 2회)은 GitHub Actions 가 무료로 실행한다 → .github/workflows/reports.yml
#
# 사전 준비 (Blueprint 적용 전에 반드시):
#   Render 대시보드 → Environment Groups → 이름 "stock-assistant-secrets" 그룹을 만들고
#   DATABASE_URL(Supabase Session pooler 주소)을 넣는다. 자세한 순서는 infra/render.md 참고.
#   (비밀번호·API 키는 이 파일·코드에 절대 적지 않는다.)
# Python 버전은 .python-version(3.12) 파일로 지정한다.

services:
  - type: web
    name: stock-assistant-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install .
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - fromGroup: stock-assistant-secrets
      - key: CORS_ORIGINS
        value: https://stockassistant2.netlify.app
      - key: JOB_TRIGGER_TOKEN
        generateValue: true
