# Netlify 배포 설정 — 웹 대시보드(Next.js)는 frontend/ 폴더에 있다.
# 백엔드(FastAPI, backend/)는 Netlify 에서 실행되지 않으므로 별도 서버에 배포하고
# Netlify 환경변수 API_BASE_URL 에 그 주소를 넣어야 리포트가 표시된다.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  # 크레딧 절약: 무료 플랜은 운영 배포 1회당 15크레딧(월 300) — 웹 화면(frontend/)이 바뀐 커밋만 배포한다.
  # (리포트 내용은 배포 없이 매일 갱신됨) 종료코드 0 = 배포 건너뜀, 1 = 배포 진행.
  # 같은 커밋 재배포(Trigger deploy, 예: 환경변수 변경 후)는 항상 진행. 비교 불가(오류)면 안전하게 배포.
  ignore = 'if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# Next.js 어댑터(OpenNext)를 명시적으로 사용 — 자동 감지가 안 되면 정적 파일만 올라가 전 경로가 404 가 된다.
[[plugins]]
  package = "@netlify/plugin-nextjs"
