# Netlify 배포 설정 — 웹 대시보드(Next.js)는 frontend/ 폴더에 있다.
# 백엔드(FastAPI, backend/)는 Netlify 에서 실행되지 않으므로 별도 서버에 배포하고
# Netlify 환경변수 API_BASE_URL 에 그 주소를 넣어야 리포트가 표시된다.
[build]
  base = "frontend"
  command = "npm run build"
  publish = ".next"
  # 크레딧 절약: 무료 플랜은 운영 배포 1회당 15크레딧(월 300) — 웹 화면(frontend/)이 바뀐 커밋만 배포한다.
  # (리포트 내용은 배포 없이 매일 갱신됨) 종료코드 0 = 배포 건너뜀, 1 = 배포 진행.
  # 같은 커밋 재배포(Trigger deploy, 예: 환경변수 변경 후)는 항상 진행. 비교 불가(오류)면 안전하게 배포.
  ignore = 'if [ "$CACHED_COMMIT_REF" = "$COMMIT_REF" ]; then exit 1; fi; git diff --quiet "$CACHED_COMMIT_REF" "$COMMIT_REF" -- .'

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
  # 비밀값 '스마트 감지' 끔: 백엔드 API 공개 주소(API_BASE_URL / NEXT_PUBLIC_API_BASE_URL)가 NEXT_PUBLIC_* 규칙대로
  # 브라우저 번들에 들어가는데, Netlify 가 이를 '비밀 노출'로 오탐해 배포가 막혔다(2026-10-14, 두 번 연속).
  # 키 이름 제외(SECRETS_SCAN_OMIT_KEYS)는 스마트 감지에 적용되지 않았다.
  # 이 프로젝트의 Netlify 환경변수에는 공개 값(Firebase 웹 설정, API 공개 주소)만 둔다.
  # ⚠ 진짜 비밀(API 키·비밀번호·프록시 주소·서비스 계정 JSON)은 GitHub Secrets/Render 에만 두고 Netlify 에는 넣지 말 것.
  SECRETS_SCAN_SMART_DETECTION_ENABLED = "false"

# Next.js 어댑터(OpenNext)를 명시적으로 사용 — 자동 감지가 안 되면 정적 파일만 올라가 전 경로가 404 가 된다.
[[plugins]]
  package = "@netlify/plugin-nextjs"
