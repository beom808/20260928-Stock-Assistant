# 점검용(수동 실행): 공식 경제일정 출처(BLS·BEA·연준)의 실제 응답 형식 확인
name: probe-calendars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - run: pip install "./backend[push]"
      # 이전 점검(probe_calendars·fred·fmp·fcm·fx)은 완료 — 필요 시 아래처럼 단계를 추가해 재실행
      - name: Kiwoom investor net-buy (ka10051)
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          KIWOOM_PROXY_URL: ${{ secrets.KIWOOM_PROXY_URL }}
        run: python backend/scripts/probe_kiwoom_flows.py
      - name: Live API push endpoints (Render)
        run: |
          API=https://stock-assistant-api-7oz1.onrender.com
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/c.json -w "%{http_code}" --max-time 90 "$API/push/count" || true)
            echo "GET /push/count → $code $(cat /tmp/c.json 2>/dev/null)"
            [ "$code" = "200" ] && break
            sleep 20
          done
          # 브라우저 사전 요청(CORS preflight) — Netlify 주소에서 POST 허용 여부
          curl -s -o /dev/null -D - -X OPTIONS "$API/push/unregister" \
            -H "Origin: https://stockassistant2.netlify.app" \
            -H "Access-Control-Request-Method: POST" \
            -H "Access-Control-Request-Headers: content-type" | grep -i -E "^HTTP|access-control-allow" || true
      - name: Live report summary
        run: python backend/scripts/probe_live_reports.py
