# 점검용(수동 실행): 공식 경제일정 출처(BLS·BEA·연준)의 실제 응답 형식 확인
name: probe-calendars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - run: pip install "./backend[push]"
      - run: python backend/scripts/probe_calendars.py
      - name: FRED release names
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python backend/scripts/probe_fred.py
      - name: FMP index EOD
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: python backend/scripts/probe_fmp.py
      - name: FCM credentials (no message sent)
        env:
          FCM_PROJECT_ID: ${{ secrets.FCM_PROJECT_ID }}
          FCM_SERVICE_ACCOUNT_JSON: ${{ secrets.FCM_SERVICE_ACCOUNT_JSON }}
        run: python backend/scripts/probe_fcm.py
