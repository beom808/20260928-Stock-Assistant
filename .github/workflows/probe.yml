# 점검용(수동 실행): 공식 경제일정 출처(BLS·BEA·연준)의 실제 응답 형식 확인
name: probe-calendars

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version-file: backend/.python-version
      - run: pip install "./backend[push]"
      # 이전 점검(probe_calendars·fred·fmp·fcm·fx)은 완료 — 필요 시 아래처럼 단계를 추가해 재실행
      - name: Kiwoom investor net-buy (ka10051)
        env:
          KIWOOM_APP_KEY: ${{ secrets.KIWOOM_APP_KEY }}
          KIWOOM_APP_SECRET: ${{ secrets.KIWOOM_APP_SECRET }}
          KIWOOM_PROXY_URL: ${{ secrets.KIWOOM_PROXY_URL }}
        run: python backend/scripts/probe_kiwoom_flows.py
